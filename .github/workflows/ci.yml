name: StudyOS CI (macOS & iPadOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test on Cloud Mac (iPadOS Simulator)
    runs-on: macos-14

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 版本
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: 查看可用 iPad 模拟器设备
        run: |
          xcrun simctl list devices available | grep -E "iPad" || true

      - name: 查看可用 Xcode Schemes 与配置
        run: |
          xcodebuild -list

      - name: 编译 StudyOS (iOS Simulator 目标)
        run: |
          SCHEME=$(xcodebuild -list -json | jq -r '.project.schemes[0] // .workspace.schemes[0] // "StudyOS"')
          echo "Selected Scheme for Build: $SCHEME"
          xcodebuild build \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: 执行自动化测试套件 (iPad 模拟器运行)
        run: |
          # 自动精确提取系统中首个可用 iPad 模拟器的 UUID
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPad" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          echo "Selected Test Device UDID: $DEVICE_ID"

          SCHEME=$(xcodebuild -list -json | jq -r '.project.schemes[0] // .workspace.schemes[0] // "StudyOS"')
          echo "Selected Scheme for Test: $SCHEME"

          if [ -n "$DEVICE_ID" ]; then
            DESTINATION="platform=iOS Simulator,id=$DEVICE_ID"
            echo "Pre-booting simulator $DEVICE_ID to avoid testmanagerd cold-boot timeout..."
            xcrun simctl boot "$DEVICE_ID" || true
            xcrun simctl bootstatus "$DEVICE_ID" -b
          else
            DESTINATION="platform=iOS Simulator,name=iPad (10th generation)"
          fi
          echo "Selected Destination for Test: $DESTINATION"

          xcodebuild test \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -destination "$DESTINATION" \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 上传测试结果工件 (xcresult)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPad-Test-Results
          path: TestResults.xcresult
          retention-days: 7
