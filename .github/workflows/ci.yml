name: StudyOS CI (macOS & iPadOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-ipa:
    name: 快速打包 StudyOS.ipa (真机安装包)
    runs-on: macos-14
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 15.4
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: 打包 StudyOS.ipa 真机安装包
        run: |
          chmod +x Scripts/package_ipa.sh
          bash Scripts/package_ipa.sh

      - name: 上传 StudyOS.ipa 安装包 (供 iPad 侧载实测)
        uses: actions/upload-artifact@v4
        with:
          name: StudyOS-iPad-Release-IPA-${{ github.sha }}
          path: StudyOS.ipa
          retention-days: 14

  simulator-tests:
    name: 自动化测试套件 (iPadOS 模拟器)
    runs-on: macos-14
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 15.4
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: 查看可用 Xcode Schemes
        run: |
          xcodebuild -list

      - name: 执行自动化测试套件 (iPad 模拟器运行)
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPad" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          echo "Selected Test Device UDID: $DEVICE_ID"

          SCHEME=$(xcodebuild -list -json | jq -r '.project.schemes[0] // .workspace.schemes[0] // "StudyOS"')
          echo "Selected Scheme for Test: $SCHEME"

          if [ -n "$DEVICE_ID" ]; then
            DESTINATION="platform=iOS Simulator,id=$DEVICE_ID"
            echo "Pre-booting simulator $DEVICE_ID to avoid testmanagerd cold-boot timeout..."
            xcrun simctl boot "$DEVICE_ID" || true
            xcrun simctl bootstatus "$DEVICE_ID" -b
          else
            DESTINATION="platform=iOS Simulator,name=iPad (10th generation)"
          fi
          echo "Selected Destination for Test: $DESTINATION"

          xcodebuild test \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -destination "$DESTINATION" \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 上传测试结果工件 (xcresult)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPad-Test-Results
          path: TestResults.xcresult
          retention-days: 7
